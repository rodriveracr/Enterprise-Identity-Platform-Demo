version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: eip
      POSTGRES_PASSWORD: example
      POSTGRES_DB: eip_db
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eip"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
    ports:
      - '8000:8000'
    environment:
      - DATABASE_URL=postgresql://eip:example@db:5432/eip_db
      - OKTA_CLIENT_ID=${OKTA_CLIENT_ID}
      - OKTA_CLIENT_SECRET=${OKTA_CLIENT_SECRET}
      - OKTA_ISSUER=${OKTA_ISSUER}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
